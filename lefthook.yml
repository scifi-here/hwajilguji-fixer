pre-commit:
  parallel: true
  commands:
    biome:
      run: pnpm exec biome check .
    web-check:
      run: pnpm --dir web check
    web-test:
      run: pnpm --dir web test --passWithNoTests
    ruff-check:
      run: uv run --frozen --project tools ruff check tools
    ruff-format:
      run: uv run --frozen --project tools ruff format --check tools
    pyright:
      run: uv run --frozen --project tools pyright tools
    pytest:
      run: uv run --frozen --project tools pytest tools || test $? -eq 5
